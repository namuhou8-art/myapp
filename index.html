<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وظائف النجف</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#1565c0;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
}

.filter{
  border:0;
  background:white;
  padding:10px 15px;
  border-radius:20px;
  white-space:nowrap;
}

.filter.active{
  background:#1565c0;
  color:white;
}

#status{
  margin:15px 0;
  font-weight:bold;
}

.job{
  background:white;
  padding:17px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job h2{margin:8px 0}

.badge{
  display:inline-block;
  background:#e8f5e9;
  color:#137333;
  padding:5px 9px;
  border-radius:10px;
  font-size:13px;
  margin-left:5px;
}

.job p{
  margin:7px 0;
  color:#555;
}

.source{
  display:block;
  text-align:center;
  background:#1565c0;
  color:white;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  margin-top:12px;
}

.warning{
  background:#fff3cd;
  padding:14px;
  border-radius:12px;
  line-height:1.7;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h1>💼 وظائف النجف</h1>
  <p>كاشير • تدريب • بدون خبرة • وجميع الوظائف</p>
</header>

<div class="container">

<input
  id="search"
  class="search"
  type="search"
  placeholder="🔎 ابحث عن وظيفة..."
>

<div class="filters">
  <button class="filter active" data-filter="الكل">الكل</button>
  <button class="filter" data-filter="كاشير">كاشير</button>
  <button class="filter" data-filter="بدون خبرة">بدون خبرة</button>
  <button class="filter" data-filter="تدريب">مع تدريب</button>
</div>

<div id="status">جاري تحميل الوظائف...</div>

<div id="jobs"></div>

<div class="warning">
⚠️ لا تدفع أي مبلغ مالي مقابل الحصول على وظيفة قبل التأكد من جهة العمل.
</div>

</div>

<script>
let allJobs = [];
let filter = "الكل";

const jobsBox = document.getElementById("jobs");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");
const buttons = document.querySelectorAll(".filter");

async function loadJobs(){
  try{
    const response = await fetch("jobs.json?time=" + Date.now());

    if(!response.ok){
      throw new Error("تعذر تحميل الملف");
    }

    allJobs = await response.json();

    if(!Array.isArray(allJobs)){
      throw new Error("صيغة البيانات غير صحيحة");
    }

    showJobs();

  }catch(error){
    statusBox.textContent =
      "تعذر تحميل الوظائف حاليًا.";
  }
}

function showJobs(){

  const search =
    searchBox.value.trim().toLowerCase();

  const results = allJobs.filter(job=>{

    const text = [
      job.title,
      job.company,
      job.location,
      job.experience,
      job.training,
      job.description
    ].join(" ").toLowerCase();

    const searchMatch =
      text.includes(search);

    const filterMatch =
      filter === "الكل" ||
      text.includes(filter.toLowerCase());

    return searchMatch && filterMatch;
  });

  statusBox.textContent =
    "الوظائف المتاحة: " + results.length;

  jobsBox.innerHTML = "";

  if(results.length === 0){
    jobsBox.innerHTML =
      "<div class='job'>لا توجد وظائف مطابقة حاليًا.</div>";
    return;
  }

  results.forEach(job=>{

    const card = document.createElement("div");
    card.className = "job";

    const safeTitle = escapeHTML(job.title || "وظيفة");
    const safeCompany = escapeHTML(job.company || "غير محدد");
    const safeLocation = escapeHTML(job.location || "النجف");
    const safeSalary = escapeHTML(job.salary || "غير محدد");
    const safeExperience = escapeHTML(job.experience || "غير محدد");
    const safeDate = escapeHTML(job.date || "غير معروف");

    card.innerHTML = `
      <span class="badge">${safeExperience}</span>

      <h2>${safeTitle}</h2>

      <p>🏢 ${safeCompany}</p>
      <p>📍 ${safeLocation}</p>
      <p>💰 الراتب: ${safeSalary}</p>
      <p>👤 الخبرة: ${safeExperience}</p>
      <p>📅 النشر: ${safeDate}</p>

      ${
        job.source
        ? `<a class="source"
             href="${encodeURI(job.source)}"
             target="_blank"
             rel="noopener noreferrer">
             فتح الإعلان الأصلي
           </a>`
        : ""
      }
    `;

    jobsBox.appendChild(card);
  });
}

function escapeHTML(value){
  const div = document.createElement("div");
  div.textContent = String(value);
  return div.innerHTML;
}

searchBox.addEventListener("input",showJobs);

buttons.forEach(button=>{
  button.addEventListener("click",()=>{

    buttons.forEach(b=>
      b.classList.remove("active")
    );

    button.classList.add("active");

    filter = button.dataset.filter;

    showJobs();
  });
});

loadJobs();
</script>

</body>
</html>
